<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuis Komponen & Booting TJKT X</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .quiz-container {
            background-color: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 80%;
            max-width: 600px;
            text-align: center;
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 20px;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
        }

        .question {
            font-size: 1.2em;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .answers {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        .answer-btn {
            background-color: #ecf0f1;
            border: 2px solid #bdc3c7;
            padding: 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1em;
            text-align: left;
        }

        .answer-btn:hover {
            background-color: #e0e6e8;
            border-color: #95a5a6;
        }

        .answer-btn.correct {
            background-color: #2ecc71;
            color: white;
            border-color: #27ae60;
        }

        .answer-btn.wrong {
            background-color: #e74c3c;
            color: white;
            border-color: #c0392b;
        }

        #next-btn {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            transition: background-color 0.3s ease;
            display: none; /* Sembunyikan sampai jawaban dipilih */
        }

        #next-btn:hover {
            background-color: #2980b9;
        }

        #result-container {
            display: none;
        }

        #score-display {
            font-size: 2em;
            font-weight: bold;
            color: #2c3e50;
            margin: 20px 0;
        }

        #restart-btn {
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            transition: background-color 0.3s ease;
        }

        #restart-btn:hover {
            background-color: #27ae60;
        }
    </style>
</head>
<body>

<div class="quiz-container">
    <h1>Kuis TJKT: Komponen & Booting</h1>
    
    <div id="quiz-content">
        <div class="question" id="question-text">Memuat pertanyaan...</div>
        <div class="answers" id="answer-buttons">
            <!-- Tombol jawaban akan ditambahkan di sini oleh JavaScript -->
        </div>
        <button id="next-btn">Pertanyaan Selanjutnya</button>
    </div>

    <div id="result-container">
        <h2>Kuis Selesai!</h2>
        <p>Skor Anda adalah:</p>
        <div id="score-display">0 / 0</div>
        <p id="result-message"></p>
        <button id="restart-btn">Ulangi Kuis</button>
    </div>
</div>

<script>
    // Data Pertanyaan Kuis
    const questions = [
        {
            question: "Manakah dari komponen berikut yang sering disebut sebagai 'otak' komputer?",
            answers: [
                { text: "RAM", correct: false },
                { text: "CPU", correct: true },
                { text: "Motherboard", correct: false },
                { text: "HDD", correct: false }
            ]
        },
        {
            question: "Apa fungsi utama dari RAM dalam sebuah komputer?",
            answers: [
                { text: "Menyimpan data secara permanen", correct: false },
                { text: "Menyuplai daya ke komponen lain", correct: false },
                { text: "Menyimpan data sementara untuk diakses CPU", correct: true },
                { text: "Menghubungkan komputer ke internet", correct: false }
            ]
        },
        {
            question: "Apa kepanjangan dari POST dalam proses booting?",
            answers: [
                { text: "Power-On Self-Test", correct: true },
                { text: "Primary Operation System Test", correct: false },
                { text: "Personal Operating System Technology", correct: false },
                { text: "Pre-Operating System Transfer", correct: false }
            ]
        },
        {
            question: "Komponen manakah yang mengubah arus listrik dari stopkontak menjadi arus yang sesuai untuk komponen komputer?",
            answers: [
                { text: "Motherboard", correct: false },
                { text: "PSU (Power Supply Unit)", correct: true },
                { text: "CPU", correct: false },
                { text: "SSD", correct: false }
            ]
        },
        {
            question: "Di mana BIOS/UEFI biasanya tersimpan?",
            answers: [
                { text: "Di dalam Hard Drive (HDD)", correct: false },
                { text: "Di dalam RAM", correct: false },
                { text: "Pada chip di Motherboard", correct: true },
                { text: "Di dalam CPU", correct: false }
            ]
        }
    ];

    // Variabel State Kuis
    let currentQuestionIndex = 0;
    let score = 0;

    // Elemen DOM
    const questionTextElement = document.getElementById('question-text');
    const answerButtonsElement = document.getElementById('answer-buttons');
    const nextButton = document.getElementById('next-btn');
    const quizContent = document.getElementById('quiz-content');
    const resultContainer = document.getElementById('result-container');
    const scoreDisplay = document.getElementById('score-display');
    const resultMessage = document.getElementById('result-message');
    const restartButton = document.getElementById('restart-btn');

    // Fungsi untuk Memulai Kuis
    function startQuiz() {
        currentQuestionIndex = 0;
        score = 0;
        nextButton.innerHTML = 'Pertanyaan Selanjutnya';
        quizContent.style.display = 'block';
        resultContainer.style.display = 'none';
        showQuestion();
    }

    // Fungsi untuk Menampilkan Pertanyaan
    function showQuestion() {
        resetState();
        let currentQuestion = questions[currentQuestionIndex];
        let questionNo = currentQuestionIndex + 1;
        questionTextElement.innerHTML = questionNo + ". " + currentQuestion.question;

        currentQuestion.answers.forEach(answer => {
            const button = document.createElement('button');
            button.innerHTML = answer.text;
            button.classList.add('answer-btn');
            answerButtonsElement.appendChild(button);
            if (answer.correct) {
                button.dataset.correct = answer.correct;
            }
            button.addEventListener('click', selectAnswer);
        });
    }

    // Fungsi untuk Mereset Tampilan Sebelum Pertanyaan Baru
    function resetState() {
        nextButton.style.display = 'none';
        while (answerButtonsElement.firstChild) {
            answerButtonsElement.removeChild(answerButtonsElement.firstChild);
        }
    }

    // Fungsi yang Dipanggil Saat Jawaban Dipilih
    function selectAnswer(e) {
        const selectedBtn = e.target;
        const isCorrect = selectedBtn.dataset.correct === 'true';
        if (isCorrect) {
            selectedBtn.classList.add('correct');
            score++;
        } else {
            selectedBtn.classList.add('wrong');
        }

        // Menonaktifkan semua tombol setelah satu jawaban dipilih
        Array.from(answerButtonsElement.children).forEach(button => {
            if (button.dataset.correct === 'true') {
                button.classList.add('correct'); // Tampilkan jawaban yang benar
            }
            button.disabled = true;
        });
        nextButton.style.display = 'block';
    }

    // Fungsi untuk Menangani Tombol 'Selanjutnya'
    function handleNextButton() {
        currentQuestionIndex++;
        if (currentQuestionIndex < questions.length) {
            showQuestion();
        } else {
            showScore();
        }
    }

    // Fungsi untuk Menampilkan Skor Akhir
    function showScore() {
        resetState();
        quizContent.style.display = 'none';
        resultContainer.style.display = 'block';
        scoreDisplay.innerHTML = `${score} / ${questions.length}`;
        
        let message = '';
        if (score === questions.length) {
            message = 'Luar biasa! Anda memahami materi dengan sangat baik.';
        } else if (score >= questions.length * 0.7) {
            message = 'Bagus sekali! Anda sudah memahami sebagian besar materi.';
        } else {
            message = 'Coba pelajari lagi materinya dan ulangi kuis ini.';
        }
        resultMessage.innerHTML = message;
    }

    // Event Listeners
    nextButton.addEventListener('click', () => {
        if (currentQuestionIndex < questions.length) {
            handleNextButton();
        } else {
            startQuiz();
        }
    });

    restartButton.addEventListener('click', startQuiz);

    // Memulai kuis saat halaman dimuat
    startQuiz();

</script>

</body>
</html>
